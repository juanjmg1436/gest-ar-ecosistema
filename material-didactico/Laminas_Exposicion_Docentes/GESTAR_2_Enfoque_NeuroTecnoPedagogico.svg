<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="franja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1920" height="7" fill="url(#franja)"/>

  <!-- ══ HEADER ══ -->
  <text x="80" y="90" font-size="46" font-weight="700" fill="#ffffff">Por qué funciona: enfoque neuro-tecno-pedagógico</text>
  <text x="80" y="130" font-size="23" fill="#94a3b8">No alcanza con digitalizar el contenido. Cada recurso de la plataforma activa un mecanismo cognitivo concreto.</text>

  <!-- ══ TRES PILARES ══ -->
  <!-- NEURO -->
  <g transform="translate(80,176)">
    <rect x="0" y="0" width="560" height="212" rx="20" fill="#1a1033" stroke="#4c1d95" stroke-width="2"/>
    <g transform="translate(34,34)" stroke="#a78bfa" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M 22 8 C 6 8 0 20 0 30 C -6 36 -4 48 4 52 C 6 62 16 66 24 62 L 24 8 Z"/>
      <path d="M 26 8 C 42 8 48 20 48 30 C 54 36 52 48 44 52 C 42 62 32 66 24 62"/>
      <path d="M 12 24 L 22 30 M 14 44 L 24 40 M 34 24 L 26 30 M 36 44 L 26 40" stroke-width="3"/>
    </g>
    <text x="104" y="46" font-size="15" font-weight="700" fill="#a78bfa" letter-spacing="2">NEURO</text>
    <text x="104" y="78" font-size="26" font-weight="700" fill="#ffffff">Cómo aprende el cerebro</text>
    <text x="34" y="124" font-size="18" fill="#cbd5e1">· La atención es un recurso limitado: se sostiene</text>
    <text x="50" y="148" font-size="18" fill="#cbd5e1">con novedad y desafío, no con repetición</text>
    <text x="34" y="176" font-size="18" fill="#cbd5e1">· Lo que se decide se recuerda mejor que lo que</text>
    <text x="50" y="200" font-size="18" fill="#cbd5e1">se escucha: la acción consolida la memoria</text>
  </g>

  <!-- TECNO -->
  <g transform="translate(680,176)">
    <rect x="0" y="0" width="560" height="212" rx="20" fill="#08243a" stroke="#0369a1" stroke-width="2"/>
    <g transform="translate(36,36)">
      <rect x="6" y="6" width="44" height="44" rx="6" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <rect x="20" y="20" width="16" height="16" rx="2" fill="#38bdf8"/>
      <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
        <path d="M 18 6 L 18 -2 M 38 6 L 38 -2 M 18 50 L 18 58 M 38 50 L 38 58"/>
        <path d="M 6 18 L -2 18 M 6 38 L -2 38 M 50 18 L 58 18 M 50 38 L 58 38"/>
      </g>
    </g>
    <text x="104" y="46" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="2">TECNO</text>
    <text x="104" y="78" font-size="26" font-weight="700" fill="#ffffff">Un entorno que responde</text>
    <text x="34" y="124" font-size="18" fill="#cbd5e1">· Simula consecuencias reales sin riesgo real:</text>
    <text x="50" y="148" font-size="18" fill="#cbd5e1">se puede equivocar y volver a intentar</text>
    <text x="34" y="176" font-size="18" fill="#cbd5e1">· Los datos persisten y se integran entre apps:</text>
    <text x="50" y="200" font-size="18" fill="#cbd5e1">lo que hace hoy le condiciona el mes que viene</text>
  </g>

  <!-- PEDAGÓGICO -->
  <g transform="translate(1280,176)">
    <rect x="0" y="0" width="560" height="212" rx="20" fill="#062a22" stroke="#047857" stroke-width="2"/>
    <g transform="translate(36,40)">
      <polygon points="28,4 58,20 28,36 -2,20" fill="#34d399"/>
      <path d="M 10 28 L 10 46 C 10 54 46 54 46 46 L 46 28" fill="none" stroke="#34d399" stroke-width="4"/>
      <path d="M 56 22 L 56 44" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="104" y="46" font-size="15" font-weight="700" fill="#34d399" letter-spacing="2">PEDAGÓGICO</text>
    <text x="104" y="78" font-size="26" font-weight="700" fill="#ffffff">Una secuencia con sentido</text>
    <text x="34" y="124" font-size="18" fill="#cbd5e1">· Andamiaje: cada etapa habilita la siguiente,</text>
    <text x="50" y="148" font-size="18" fill="#cbd5e1">para no saturar la memoria de trabajo</text>
    <text x="34" y="176" font-size="18" fill="#cbd5e1">· Evaluación auténtica: se evalúa la operación</text>
    <text x="50" y="200" font-size="18" fill="#cbd5e1">completa, no la definición memorizada</text>
  </g>

  <!-- ══ BUCLE DE APRENDIZAJE ══ -->
  <text x="80" y="440" font-size="16" font-weight="700" fill="#64748b" letter-spacing="2">EL BUCLE QUE SOSTIENE LA ATENCIÓN</text>

  <g transform="translate(0,470)">
    <!-- conectores -->
    <g stroke="#334155" stroke-width="3" fill="none">
      <path d="M 260 56 L 356 56"/><path d="M 580 56 L 676 56"/>
      <path d="M 900 56 L 996 56"/><path d="M 1220 56 L 1316 56"/>
    </g>
    <g fill="#475569">
      <polygon points="356,48 372,56 356,64"/><polygon points="676,48 692,56 676,64"/>
      <polygon points="996,48 1012,56 996,64"/><polygon points="1316,48 1332,56 1316,64"/>
    </g>

    <!-- nodos -->
    <g>
      <circle cx="200" cy="56" r="52" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
      <text x="200" y="64" font-size="30" font-weight="700" fill="#a78bfa" text-anchor="middle">1</text>
      <text x="200" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Desafío</text>
      <text x="200" y="168" font-size="16" fill="#94a3b8" text-anchor="middle">Una consigna con</text>
      <text x="200" y="190" font-size="16" fill="#94a3b8" text-anchor="middle">dificultad justa</text>
    </g>
    <g>
      <circle cx="520" cy="56" r="52" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
      <text x="520" y="64" font-size="30" font-weight="700" fill="#60a5fa" text-anchor="middle">2</text>
      <text x="520" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Decisión</text>
      <text x="520" y="168" font-size="16" fill="#94a3b8" text-anchor="middle">El estudiante elige</text>
      <text x="520" y="190" font-size="16" fill="#94a3b8" text-anchor="middle">y se compromete</text>
    </g>
    <g>
      <circle cx="840" cy="56" r="52" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
      <text x="840" y="64" font-size="30" font-weight="700" fill="#38bdf8" text-anchor="middle">3</text>
      <text x="840" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Consecuencia</text>
      <text x="840" y="168" font-size="16" fill="#94a3b8" text-anchor="middle">El sistema reacciona</text>
      <text x="840" y="190" font-size="16" fill="#94a3b8" text-anchor="middle">al instante</text>
    </g>
    <g>
      <circle cx="1160" cy="56" r="52" fill="#052e16" stroke="#34d399" stroke-width="3"/>
      <text x="1160" y="64" font-size="30" font-weight="700" fill="#34d399" text-anchor="middle">4</text>
      <text x="1160" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Feedback</text>
      <text x="1160" y="168" font-size="16" fill="#94a3b8" text-anchor="middle">Ve el error y</text>
      <text x="1160" y="190" font-size="16" fill="#94a3b8" text-anchor="middle">entiende por qué</text>
    </g>
    <g>
      <circle cx="1480" cy="56" r="52" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
      <text x="1480" y="64" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="middle">5</text>
      <text x="1480" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Logro</text>
      <text x="1480" y="168" font-size="16" fill="#94a3b8" text-anchor="middle">Refuerza y habilita</text>
      <text x="1480" y="190" font-size="16" fill="#94a3b8" text-anchor="middle">el desafío siguiente</text>
    </g>

    <!-- reinicio del ciclo -->
    <g stroke="#334155" stroke-width="3" fill="none">
      <path d="M 1540 56 L 1600 56"/>
    </g>
    <polygon points="1600,48 1616,56 1600,64" fill="#475569"/>
    <g transform="translate(1700,56)">
      <circle cx="0" cy="0" r="52" fill="#1e293b" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
      <path d="M -18 8 A 20 20 0 1 1 -2 22" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
      <polygon points="-25,0 -9,4 -19,15" fill="#94a3b8"/>
      <text x="0" y="86" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Vuelve a empezar</text>
      <text x="0" y="112" font-size="16" fill="#94a3b8" text-anchor="middle">con más complejidad sobre</text>
      <text x="0" y="134" font-size="16" fill="#94a3b8" text-anchor="middle">lo que ya consolidó</text>
    </g>
  </g>

  <!-- ══ RECURSO → MECANISMO ══ -->
  <text x="80" y="740" font-size="16" font-weight="700" fill="#64748b" letter-spacing="2">CADA RECURSO RESPONDE A UN MECANISMO, NO A UNA MODA</text>

  <g transform="translate(80,760)">
    <g>
      <rect x="0" y="0" width="424" height="112" rx="14" fill="#131c30" stroke="#1e293b" stroke-width="2"/>
      <text x="22" y="38" font-size="19" font-weight="700" fill="#fbbf24">Puntos, niveles y desafíos</text>
      <text x="22" y="68" font-size="16" fill="#94a3b8">Convierten una tarea larga en metas</text>
      <text x="22" y="92" font-size="16" fill="#94a3b8">cortas: sostienen la atención.</text>
    </g>
    <g transform="translate(448,0)">
      <rect x="0" y="0" width="424" height="112" rx="14" fill="#131c30" stroke="#1e293b" stroke-width="2"/>
      <text x="22" y="38" font-size="19" font-weight="700" fill="#38bdf8">Etapas que se desbloquean</text>
      <text x="22" y="68" font-size="16" fill="#94a3b8">Dosifican la carga cognitiva: nadie</text>
      <text x="22" y="92" font-size="16" fill="#94a3b8">liquida IVA antes de saber facturar.</text>
    </g>
    <g transform="translate(896,0)">
      <rect x="0" y="0" width="424" height="112" rx="14" fill="#131c30" stroke="#1e293b" stroke-width="2"/>
      <text x="22" y="38" font-size="19" font-weight="700" fill="#34d399">El error no tiene costo real</text>
      <text x="22" y="68" font-size="16" fill="#94a3b8">Habilita el error productivo: se explora</text>
      <text x="22" y="92" font-size="16" fill="#94a3b8">sin miedo a arruinar nada.</text>
    </g>
    <g transform="translate(1344,0)">
      <rect x="0" y="0" width="424" height="112" rx="14" fill="#131c30" stroke="#1e293b" stroke-width="2"/>
      <text x="22" y="38" font-size="19" font-weight="700" fill="#a78bfa">Datos que se arrastran</text>
      <text x="22" y="68" font-size="16" fill="#94a3b8">Fuerzan la transferencia: la venta de hoy</text>
      <text x="22" y="92" font-size="16" fill="#94a3b8">reaparece en la DDJJ del mes.</text>
    </g>
  </g>

  <!-- ══ CIERRE ══ -->
  <g transform="translate(80,912)">
    <rect x="0" y="0" width="1760" height="120" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="url(#franja)"/>
    <text x="40" y="52" font-size="27" font-weight="700" fill="#ffffff">No se gamifica el premio: se gamifica el proceso de pensar.</text>
    <text x="40" y="92" font-size="20" fill="#94a3b8">El puntaje no reemplaza al contenido — ordena el recorrido, marca el progreso y le devuelve al estudiante una pregunta mejor que la anterior.</text>
  </g>
</svg>
